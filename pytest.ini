[pytest]
# Offline unit tests and on-demand network tests. The existing script-style
# tests under scripts/tests/test_suite/ live outside testpaths, so pytest never
# collects them (Requirement 16.3); they keep running as scripts.
testpaths = scripts/tests/unit scripts/tests/network
pythonpath = scripts
markers =
    network: calls live ATS endpoints
# Default to the offline suite. `pytest -m network` on the command line
# overrides this expression to select the network tests instead.
addopts = -m "not network"
