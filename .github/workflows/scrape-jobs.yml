name: Update Job Listings (data-repo pipeline, manual only)
on:
  # Single-repo setup: the personal site is published by
  # update-job-board.yml. This upstream data-repo pipeline is kept for
  # reference but runs only on manual dispatch (no daily schedule), and
  # only publishes when the DATA_REPO repository variable is set.
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max to prevent hanging
    env:
      # Data_Repo is named by a repository variable so no owner/repo is hardcoded.
      # Steps that touch the data repo are gated on this being non-empty (15.1).
      DATA_REPO: ${{ vars.DATA_REPO }}
      # JD summarizer backend; defaults to the offline keyword backend (15.6).
      JD_BACKEND: ${{ vars.JD_BACKEND || 'keyword' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.txt

      # Install runtime and dev dependencies, then run the offline test suite
      # before scraping. A test failure stops the run (15.4, 15.5).
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run offline tests
        run: pytest -m "not network" -q

      # Pull yesterday's chunk data from the Data_Repo into the working tree so
      # merge_data.py can read existing jobs and merge into them. Without this,
      # load_chunks("data") finds nothing and the merge discards all accumulated
      # history, collapsing the dataset. Only runs when DATA_REPO is set (15.1).
      - name: Fetch existing data from data repo
        if: env.DATA_REPO != ''
        run: |
          git clone --depth 1 "https://github.com/${DATA_REPO}.git" prev-data
          mkdir -p data/chunks
          cp -r prev-data/data/chunks/* data/chunks/ 2>/dev/null || true
          cp prev-data/data/metadata.json data/metadata.json 2>/dev/null || true

      - name: Run job scraper
        run: |
          cd scripts
          python scraper.py --source automated

      - name: Merge with existing data
        run: python scripts/merge_data.py

      - name: Save trend snapshot
        run: |
          mkdir -p data/trends
          DATE=$(date +'%Y-%m-%d')

          # Per-platform breakdown from the scraper output
          GREENHOUSE=$(jq '[.[] | select(.ats == "Greenhouse")] | length' scripts/output/all_jobs.json)
          ASHBY=$(jq '[.[] | select(.ats == "Ashby")] | length' scripts/output/all_jobs.json)
          BAMBOOHR=$(jq '[.[] | select(.ats == "BambooHR")] | length' scripts/output/all_jobs.json)
          LEVER=$(jq '[.[] | select(.ats == "Lever")] | length' scripts/output/all_jobs.json)
          WORKDAY=$(jq '[.[] | select(.ats == "Workday")] | length' scripts/output/all_jobs.json)
          ICIMS=$(jq '[.[] | select(.ats == "iCIMS")] | length' scripts/output/all_jobs.json)
          PAYLOCITY=$(jq '[.[] | select(.ats == "Paylocity")] | length' scripts/output/all_jobs.json)

          # Tier breakdown
          INTERN=$(jq '[.[] | select(.skill_level == "intern")] | length' scripts/output/all_jobs.json)
          ENTRY=$(jq '[.[] | select(.skill_level == "entry")] | length' scripts/output/all_jobs.json)
          MID=$(jq '[.[] | select(.skill_level == "mid")] | length' scripts/output/all_jobs.json)
          SENIOR=$(jq '[.[] | select(.skill_level == "senior")] | length' scripts/output/all_jobs.json)

          # Active companies count
          COMPANIES=$(jq '. | length' scripts/output/active_companies.json)
          RECRUITER=$(jq -r '.recruiter_jobs' scripts/output/metadata.json)

          # -c forces compact single-line output so daily.jsonl stays valid JSONL
          jq -nc \
            --arg date "$DATE" \
            --argjson total_jobs "$(jq -r '.total_jobs' data/metadata.json)" \
            --argjson active_companies "$COMPANIES" \
            --argjson recruiter_jobs "$RECRUITER" \
            --argjson greenhouse "$GREENHOUSE" \
            --argjson ashby "$ASHBY" \
            --argjson bamboohr "$BAMBOOHR" \
            --argjson lever "$LEVER" \
            --argjson workday "$WORKDAY" \
            --argjson icims "$ICIMS" \
            --argjson paylocity "$PAYLOCITY" \
            --argjson intern "$INTERN" \
            --argjson entry "$ENTRY" \
            --argjson mid "$MID" \
            --argjson senior "$SENIOR" \
            '{
              date: $date,
              total_jobs: $total_jobs,
              active_companies: $active_companies,
              recruiter_jobs: $recruiter_jobs,
              by_platform: {
                greenhouse: $greenhouse,
                ashby: $ashby,
                bamboohr: $bamboohr,
                lever: $lever,
                workday: $workday,
                icims: $icims,
                paylocity: $paylocity
              },
              by_tier: {
                intern: $intern,
                entry: $entry,
                mid: $mid,
                senior: $senior
              }
            }' >> data/trends/daily.jsonl
      - name: Get job count and timestamp
        id: metadata
        run: |
          JOBS=$(jq -r '.total_jobs' data/metadata.json)
          COMPANIES=$(jq '. | length' scripts/output/active_companies.json)
          DATE=$(date +'%Y-%m-%d %H:%M UTC')
          echo "jobs=$JOBS" >> $GITHUB_OUTPUT
          echo "companies=$COMPANIES" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "tag=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      # --- Publishing steps: main only (15.2) ---
      # On non-main runs these are skipped and artifacts are uploaded instead (15.3).

      - name: Compress release files
        if: github.ref == 'refs/heads/main'
        run: gzip -k scripts/output/all_jobs.json

      - name: Clean old releases (keep last 10)
        if: github.ref == 'refs/heads/main'
        run: |
          RELEASES=$(gh release list --limit 100 --json tagName -q '.[10:] | .[].tagName')
          if [ -n "$RELEASES" ]; then
            echo "$RELEASES" | while read tag; do
              echo "Deleting release: $tag"
              gh release delete "$tag" --cleanup-tag -y
            done
          else
            echo "No old releases to clean up"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release with job data
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: jobs-${{ steps.metadata.outputs.tag }}
          name: Jobs Update - ${{ steps.metadata.outputs.date }}
          body: |
            ## Job Board Update (Automated)
            **Total Jobs:** ${{ steps.metadata.outputs.jobs }}  
            **Active Companies:** ${{ steps.metadata.outputs.companies }}  
            **Last Updated:** ${{ steps.metadata.outputs.date }}
            The chunked job data is served from the Data_Repo via GitHub Pages.
          files: |
            scripts/output/all_jobs.json.gz
            scripts/output/active_companies.json
            scripts/output/metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Trend history is append-only and tiny; it stays tracked on main.
      - name: Commit trend history to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/trends/daily.jsonl
          git diff --staged --quiet || git commit -m "Trend snapshot $(date +'%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push origin main

      - name: Check for platform anomalies
        if: github.ref == 'refs/heads/main'
        id: anomaly
        continue-on-error: true
        run: python scripts/check_anomalies.py

      - name: Open issue on anomaly
        if: github.ref == 'refs/heads/main' && steps.anomaly.outputs.anomaly == 'true'
        run: |
          gh issue create \
            --title "Scraper anomaly $(date +'%Y-%m-%d')" \
            --body "${{ steps.anomaly.outputs.report }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Force-push regenerated data to the Data_Repo. Runs only on main AND when
      # DATA_REPO is configured (15.1, 15.2). DATA_REPO_TOKEN authenticates the push.
      - name: Push regenerated data to data repo
        if: github.ref == 'refs/heads/main' && env.DATA_REPO != ''
        run: |
          git clone "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" data-repo
          cd data-repo
          git checkout --orphan fresh
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p data/chunks .github
          cp -r ../.github/data-repo-workflows .github/workflows
          cp -r ../data/chunks/* data/chunks/
          cp ../data/metadata.json data/metadata.json
          cp ../data/README.md README.md
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "Data snapshot $(date +'%Y-%m-%d %H:%M UTC')"
          git branch -D main 2>/dev/null || true
          git branch -m main
          git push -f origin main
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}

      # --- Non-main runs: upload artifacts instead of publishing (15.3) ---
      - name: Upload scraper output artifacts
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output
          path: |
            scripts/output/all_jobs.json
            scripts/output/diagnostics.json
          if-no-files-found: warn
