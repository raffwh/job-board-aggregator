name: Update personal job board

on:
  workflow_dispatch:
  schedule:
    - cron: "00 10 * * *"
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: personal-job-board-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run offline test suite
        run: pytest -m "not network" -q

      - name: Scrape selected ATS companies
        env:
          JD_BACKEND: ${{ vars.JD_BACKEND || 'keyword' }}
        run: python scripts/scraper.py --source automated

      - name: Inspect scraper output
        run: |
          echo "Contents of scripts/output:"
          ls -lah scripts/output || true
          test -f scripts/output/all_jobs.json
          test -f scripts/output/metadata.json
          python - <<'PY'
          import json
          from collections import Counter
          with open("scripts/output/all_jobs.json", "r", encoding="utf-8") as f:
              jobs = json.load(f)
          print("ATS counts:", Counter(j.get("ats","Unknown") for j in jobs))
          PY

      - name: Fetch previous site jobs.json
        # Read-only public GET so build_site.py can carry first_seen forward by
        # job id (Requirements 15.10, 14.15, 14.16). Non-fatal: a missing or
        # unreachable file simply means every job starts its own first_seen.
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          curl -fsSL "$SITE_URL/jobs.json" -o scripts/output/previous_site_jobs.json \
            || echo "No previous jobs.json; first_seen starts fresh"

      - name: Build small static site
        run: python scripts/build_site.py --previous scripts/output/previous_site_jobs.json

      - name: Enforce published-site size budget
        run: |
          SIZE_BYTES=$(du -sb site | cut -f1)
          LIMIT_BYTES=$((100 * 1024 * 1024))
          echo "Site size: ${SIZE_BYTES} bytes"
          test "${SIZE_BYTES}" -le "${LIMIT_BYTES}"

      - name: Upload run artifacts
        # Always upload, on every ref, so branch runs are inspectable without
        # deploying (Requirement 15.3).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-job-board
          path: |
            scripts/output/all_jobs.json
            scripts/output/diagnostics.json
            site
          if-no-files-found: warn

      - name: Upload Pages artifact
        # Publishing_Step: only on main (Requirement 15.2).
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Publishing_Step: the deploy job runs only on main (Requirement 15.2).
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
